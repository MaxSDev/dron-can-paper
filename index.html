<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dron-Can: Feasibility of Aerial Detection of Lost Dogs Using Commercial UAVs and Computer Vision">
  <title>Dron-Can · PDF</title>
  <style>
    /* Sin interfaz propia cuando el navegador puede mostrar el PDF. */
    html, body { margin: 0; width: 100%; height: 100%; }
    body { background: #e5e5e5; }
    #pdf { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }

    /* Este contenido solo aparece si falla el visor nativo o se fuerza ?fallback=1. */
    .pages {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: #e5e5e5;
    }
    .pages img {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      background: white;
      box-shadow: 0 1px 5px #0002;
    }
    @media (max-width: 600px) {
      .pages { padding: 0; gap: 8px; }
      .pages img { box-shadow: none; }
    }
  </style>
</head>
<body>
  <object id="pdf" data="./dron-can.pdf" type="application/pdf" aria-label="Leer el PDF original de Dron-Can">
    <main id="pages" class="pages" aria-label="Versión alternativa por imágenes del artículo">
      <img src="./pages/page-1.jpg" alt="Página 1 de 5" loading="eager">
      <img src="./pages/page-2.jpg" alt="Página 2 de 5" loading="lazy">
      <img src="./pages/page-3.jpg" alt="Página 3 de 5" loading="lazy">
      <img src="./pages/page-4.jpg" alt="Página 4 de 5" loading="lazy">
      <img src="./pages/page-5.jpg" alt="Página 5 de 5" loading="lazy">
    </main>
  </object>
  <script src="./app.js" defer></script>
</body>
</html>
